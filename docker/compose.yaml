name: nuclera

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_API_DOCS_URL: /docs
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

